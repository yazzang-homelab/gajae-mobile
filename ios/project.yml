name: GjcMobile
options:
  bundleIdPrefix: dev.gajae
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ko
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    # Xcode Cloud signs automatically for the project's team; without it the archive has no team to sign for.
    DEVELOPMENT_TEAM: 6Z6SXY7BTZ
    # Review demo host offer URL, from the build environment (xcodebuild GJCM_DEMO_OFFER_URL=…); empty hides the demo.
    GJCM_DEMO_OFFER_URL: ""
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  GjcMobileCore:
    path: Core
targets:
  GjcMobile:
    type: application
    # A shared scheme in the generated project: Xcode Cloud only builds shared schemes. The UI test drives the
    # demo-host flow that .github/workflows/ios-footage.yml records.
    scheme:
      testTargets:
        - GjcMobileUITests
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: GjcMobileCore
      - target: GjcWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.gajae.gjcmobile
        PRODUCT_NAME: GjcMobile
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_CFBundleDisplayName: 가재코드
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_NSCameraUsageDescription: 호스트 페어링 QR 코드를 스캔합니다.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: 같은 네트워크에 있는 가재코드 브리지에 연결합니다.
    info:
      path: App/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: dev.gajae.gjcmobile.pair
            CFBundleURLSchemes: [gjcm]
        # Bridge traffic is end-to-end encrypted (gjcm-e2ee-v1) on top of ws:// to LAN/Tailscale
        # addresses, so ATS transport TLS adds nothing; the hosts are raw IPs without certificates.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        UILaunchScreen: {}
        # Export compliance: only standard algorithms (X25519, HKDF-SHA256, AES-256-GCM via swift-crypto) protecting
        # the user's own data in a mass-market app — exempt under Category 5 Part 2 (5D992.c), so no per-build prompt.
        ITSAppUsesNonExemptEncryption: false
        # Public review demo host (bridge/demo, deploy/gjcm-demo.service): "데모 호스트로 체험" pairs with
        # the reusable link this URL hands out. Scripted replies only; nothing runs on that machine.
        GJCMDemoOfferURL: $(GJCM_DEMO_OFFER_URL)
        # Widget snapshot refresh while the app is closed (App/WidgetRefresher.swift); iOS picks the times.
        BGTaskSchedulerPermittedIdentifiers: [dev.gajae.gjcmobile.widget-refresh]
        UIBackgroundModes: [fetch]
    # The App Group carries the widget snapshot (WidgetHost.appGroup); keys stay in the app's own Keychain.
    entitlements:
      path: App/GjcMobile.entitlements
      properties:
        com.apple.security.application-groups: [group.dev.gajae.gjcmobile]
  GjcWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: App/Theme.swift
    dependencies:
      - package: GjcMobileCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.gajae.gjcmobile.widget
        PRODUCT_NAME: GjcWidget
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_CFBundleDisplayName: 가재코드
        SKIP_INSTALL: YES
    info:
      path: Widget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/GjcWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.dev.gajae.gjcmobile]
  GjcMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: GjcMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.gajae.gjcmobile.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: GjcMobile
